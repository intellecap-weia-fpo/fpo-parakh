services:
  db:
    image: postgres:16-alpine
    container_name: erp_dev_db
    environment:
      POSTGRES_DB: erp_dev
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erp_dev_redis
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_dev_web
    ports:
      - "9088:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY}
      - DATABASE_URL=postgresql://erp_user:${POSTGRES_PASSWORD}@db:5432/erp_dev
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - SITE_URL=http://localhost:9088
      - OPENAI_API_KEY=
      - OPENAI_API_BASE_URL=https://openrouter.ai/api/v1
      - OPENAI_TRANSLATION_MODEL=moonshotai/kimi-k2
    volumes:
      - media_dev_data:/app/media
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "python", "manage.py", "runserver", "0.0.0.0:8000"]
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - "*.pyc"
            - .git/
        - action: rebuild
          path: pyproject.toml

volumes:
  postgres_dev_data:
  redis_dev_data:
  media_dev_data:
