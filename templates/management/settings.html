{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-card rounded-lg shadow-sm border border-border p-6">
            <h1 class="text-2xl font-bold text-card-foreground mb-2">{{ page_title }}</h1>
            <p class="text-muted-foreground mb-6">{{ page_subtitle }}</p>
            
            <div class="space-y-4">
                <div class="bg-muted p-4 rounded-lg">
                    <h2 class="text-lg font-semibold mb-2">System Settings</h2>
                    <p class="text-muted-foreground">Settings management interface coming soon.</p>
                </div>
                
                <div class="bg-muted p-4 rounded-lg">
                    <h2 class="text-lg font-semibold mb-2">Configuration</h2>
                    <p class="text-muted-foreground">System configuration options will be available here.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
